services:
  postgres:
    image: postgres:16-alpine
    container_name: claudetorio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: claudetorio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: claudetorio
    volumes:
      - /var/claudetorio/data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudetorio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: claudetorio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /var/claudetorio/data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  broker:
    build:
      context: ../../packages/broker
    container_name: claudetorio-broker
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=postgresql://claudetorio:${POSTGRES_PASSWORD}@localhost:5432/claudetorio
      - REDIS_URL=redis://localhost:6379
      - RCON_PASSWORD=${RCON_PASSWORD}
      - FACTORIO_IMAGE=${FACTORIO_IMAGE:-}
      - FACTORIO_CONFIG_PATH=${FACTORIO_CONFIG_PATH:-/opt/claudetorio/config/factorio}
      - FACTORIO_SCENARIOS_VOLUME=${FACTORIO_SCENARIOS_VOLUME:-}
      - FACTORIO_SCENARIOS_PATH=${FACTORIO_SCENARIOS_PATH:-/opt/claudetorio/config/factorio-scenarios}
      # Stream server configuration - subdomain routing through Caddy
      - STREAM_DOMAIN=stream.claudetorio.ai
      # Docker settings for run-worker containers
      - DOCKER_NETWORK=host
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../../packages/frontend
    container_name: claudetorio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://157.254.222.103:8080
      - NEXT_PUBLIC_STREAM_URL=https://157.254.222.104:3003
      - BROKER_URL=http://157.254.222.103:8080

  # Build-only target — image used by broker to spawn run-worker containers
  run-worker:
    build:
      context: ../../packages
      dockerfile: run-worker/Dockerfile
    image: claudetorio-run-worker
    profiles: ["build-only"]
