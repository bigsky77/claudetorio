services:
  postgres:
    image: postgres:16-alpine
    container_name: claudetorio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: claudetorio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: claudetorio
    volumes:
      - /var/claudetorio/data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudetorio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - claudetorio_game

  redis:
    image: redis:7-alpine
    container_name: claudetorio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /var/claudetorio/data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - claudetorio_game

  # Populate named volume with Factorio server config files.
  factorio-config-init:
    image: alpine
    command: sh -c "cp -f /src/* /dest/ && echo 'Factorio config volume populated'"
    volumes:
      - claudetorio_factorio_config:/dest
      - ../../packages/fle/fle/cluster/config:/src:ro
    networks:
      - claudetorio_game

  # Populate named volume with Factorio scenario files.
  factorio-scenarios-init:
    image: alpine
    command: sh -c "cp -rf /src/* /dest/ && echo 'Factorio scenarios volume populated'"
    volumes:
      - claudetorio_factorio_scenarios:/dest
      - ../../packages/fle/fle/cluster/scenarios:/src:ro
    networks:
      - claudetorio_game

  # Populate named volume with Factorio client files so
  # dynamically-spawned stream-client containers can mount them without host paths.
  factorio-client-init:
    image: alpine
    command: sh -c "cp -rn /src/* /dest/ 2>/dev/null; echo 'Factorio client volume ready'"
    volumes:
      - claudetorio_factorio_client:/dest
      - ${FACTORIO_CLIENT_PATH}:/src:ro
    networks:
      - claudetorio_game

  broker:
    build:
      context: ../../packages/broker
    container_name: claudetorio-broker
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=claudetorio
      - POSTGRES_USER=claudetorio
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - RCON_PASSWORD=${RCON_PASSWORD}
      - FACTORIO_IMAGE=${FACTORIO_IMAGE}
      - FACTORIO_CONFIG_VOLUME=claudetorio_factorio_config
      - FACTORIO_SCENARIOS_VOLUME=claudetorio_factorio_scenarios
      # Stream server configuration - subdomain routing through Caddy
      - STREAM_DOMAIN=stream.claudetorio.ai
      - STREAM_URL=157.254.222.103
      # Stream client configuration
      - FACTORIO_CLIENT_VOLUME=claudetorio_factorio_client
      - STREAM_CLIENT_NETWORK=claudetorio_game
      # Docker settings for run-worker containers
      - DOCKER_NETWORK=claudetorio_game
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - claudetorio_game

  frontend:
    build:
      context: ../../packages/frontend
    container_name: claudetorio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://157.254.222.103:8080
      - NEXT_PUBLIC_STREAM_URL=https://157.254.222.104:3003
      - BROKER_URL=http://broker:8080
    networks:
      - claudetorio_game

  # Build-only target — image used by broker to spawn run-worker containers
  run-worker:
    build:
      context: ../../packages
      dockerfile: run-worker/Dockerfile
    image: claudetorio-run-worker
    profiles: ["build-only"]

  # Build-only target — image used by broker to spawn stream-client containers
  stream-client:
    build:
      context: ../../packages/stream-client
    image: claudetorio-stream-client
    profiles: ["build-only"]

networks:
  claudetorio_game:
    name: claudetorio_game
    driver: bridge

volumes:
  claudetorio_factorio_config:
    name: claudetorio_factorio_config
  claudetorio_factorio_scenarios:
    name: claudetorio_factorio_scenarios
  claudetorio_factorio_client:
    name: claudetorio_factorio_client
