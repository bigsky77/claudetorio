services:
  # Caddy reverse proxy - terminates TLS and routes to stream clients
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - STREAM_DOMAIN=${STREAM_DOMAIN:-stream.localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - stream-network

  # Build-only target — image used by broker to spawn stream-client containers
  stream-client:
    build:
      context: ../../packages/stream-client
    image: claudetorio-stream-client
    profiles: ["build-only"]

networks:
  stream-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
