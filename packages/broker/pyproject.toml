[project]
name = "claudetorio-broker"
version = "1.0.0"
description = "Claudetorio Session Broker - manages Factorio AI agent sessions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "redis>=5.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "mcrcon>=0.7.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
]
