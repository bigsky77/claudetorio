worker_processes 1;
events { worker_connections 64; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 5;

    server {
        listen 3000;

        # HLS segments
        location /hls/ {
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        # Serve /stream.m3u8 directly (used by StreamPanel which appends /stream.m3u8)
        location /stream.m3u8 {
            alias /tmp/hls/stream.m3u8;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            types { application/vnd.apple.mpegurl m3u8; }
        }

        # hls.js player page at root (StreamPanel loads this in an iframe)
        location / {
            root /app/static;
            try_files $uri /index.html;
        }
    }
}
