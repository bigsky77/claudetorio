# Simulates BOTH servers in one compose for local dev
services:
  # === DATABASE LAYER ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claudetorio
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: claudetorio
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed-data.sql:/docker-entrypoint-initdb.d/seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudetorio"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # === GAME SERVER COMPONENTS ===
  # Factorio servers are spawned dynamically per-slot by the broker

  # Init: populate a named volume with Factorio server config files so
  # dynamically-spawned containers can mount them without host paths.
  # remember :ro
  factorio-config-init:
    image: alpine
    volumes:
      - claudetorio_factorio_config:/dest
      - ../packages/fle/fle/cluster/config:/src #:ro
    entrypoint: ["sh", "-c", "cp -f /src/* /dest/ && echo 'Factorio config volume populated'"]

  # Init: populate a named volume with Factorio scenario files so
  # dynamically-spawned containers can load the FLE open_world scenario.
  factorio-scenarios-init:
    image: alpine
    volumes:
      - claudetorio_factorio_scenarios:/dest
      - ../packages/fle/fle/cluster/scenarios:/src
    entrypoint: ["sh", "-c", "cp -rf /src/* /dest/ && echo 'Factorio scenarios volume populated'"]

  # Init: populate a named volume with Factorio client files so
  # dynamically-spawned stream-client containers can mount them without host paths.
  factorio-client-init:
    image: alpine
    volumes:
      - claudetorio_factorio_client:/dest
      - ${FACTORIO_CLIENT_PATH:-./factorio-client}:/src #:ro
    entrypoint: ["sh", "-c", "cp -rn /src/* /dest/ 2>/dev/null; echo 'Factorio client volume ready'"]

  broker:
    build:
      context: ../packages/broker
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../packages/broker/app:/app/app
      - ../packages/broker/main.py:/app/main.py
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=claudetorio
      - POSTGRES_USER=claudetorio
      - POSTGRES_PASSWORD=dev_password
      - REDIS_HOST=redis
      - RCON_PASSWORD=dev_rcon_password
      - BASE_RCON_PORT=27015
      # Slot-aware UDP base: slot N uses BASE_UDP_PORT + N
      - BASE_UDP_PORT=34197
      - FACTORIO_IMAGE=factoriotools/factorio:1.1.110
      - FACTORIO_CONFIG_VOLUME=claudetorio_factorio_config
      - FACTORIO_SCENARIOS_VOLUME=claudetorio_factorio_scenarios
      # Stream public endpoint configuration (port-based)
      - STREAM_URL=localhost
      - STREAM_BASE_PORT=3002
      - STREAM_PUBLIC_HOST=localhost
      # Docker settings for run-worker containers
      - DOCKER_NETWORK=claudetorio_game
      # Docker settings for stream-client containers
      - STREAM_CLIENT_IMAGE=claudetorio-stream-client
      - FACTORIO_CLIENT_VOLUME=claudetorio_factorio_client
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TWITCH_STREAM_KEY=${TWITCH_STREAM_KEY:-}
      - KICK_STREAM_KEY=${KICK_STREAM_KEY:-}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - TWITCH_CHANNEL=${TWITCH_CHANNEL:-}
      - STREAM_WORKER_IMAGE=claudetorio-stream-worker
      - REPLAY_STREAM_BASE_PORT=4002
      - REPLAY_UDP_BASE_PORT=35100
      - REPLAY_RCON_BASE_PORT=28000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../packages/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
        - NEXT_PUBLIC_STREAM_URL=http://localhost:3002
        - NEXT_PUBLIC_TWITCH_CHANNEL=${TWITCH_CHANNEL:-}
        - NEXT_PUBLIC_TWITCH_EMBED_PARENT=localhost
    ports:
      - "3000:3000"
    environment:
      - BROKER_URL=http://broker:8080
      - TWITCH_CHANNEL=${TWITCH_CHANNEL:-}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
    depends_on:
      - broker

  # === BUILD-ONLY TARGETS ===
  # Images used by broker to spawn containers dynamically via `docker run`

  # Build-only target — image used by broker to spawn stream-client containers
  # override the entrypoint to make the image persist
  stream-client:
    build:
      context: ../packages/stream-client
    image: claudetorio-stream-client
    platform: linux/amd64
    entrypoint: ["sh", "-c", "echo 'stream client image ready'"]
    restart: "no"
  # Build-only target — image used by broker to spawn run-worker containers
  run-worker:
    build:
      context: ../packages
      dockerfile: run-worker/Dockerfile
    image: claudetorio-run-worker
    platform: linux/amd64
    entrypoint: ["sh", "-c", "echo 'stream client image ready'"]
    restart: "no"
  # Build-only target — image used by broker to spawn stream-worker containers
  stream-worker:
    build:
      context: ../packages
      dockerfile: stream-worker/Dockerfile
    image: claudetorio-stream-worker
    platform: linux/amd64
    entrypoint: ["sh", "-c", "echo 'stream-worker image ready'"]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  claudetorio_factorio_config:
    name: claudetorio_factorio_config
  claudetorio_factorio_scenarios:
    name: claudetorio_factorio_scenarios
  claudetorio_factorio_client:
    name: claudetorio_factorio_client

networks:
  default:
    name: claudetorio_game
