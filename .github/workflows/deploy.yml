name: Deploy

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types: [completed]
    branches: [main]

jobs:
  deploy-game-server:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull images and sync repo
        timeout-minutes: 5
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=6 root@${{ secrets.GAME_SERVER_HOST }} bash -s << 'ENDSSH'
            set -euo pipefail
            set -a; source /opt/claudetorio/machines/game-server/.env; set +a
            echo "$GHCR_PAT" | docker login ghcr.io -u bigsky77 --password-stdin
            for img in broker frontend run-worker stream-worker; do
              echo "Pulling $img..."
              docker pull ghcr.io/bigsky77/claudetorio-${img}:latest
              docker tag ghcr.io/bigsky77/claudetorio-${img}:latest claudetorio-${img}:latest
            done
            git -C /opt/claudetorio fetch origin main
            git -C /opt/claudetorio reset --hard origin/main
          ENDSSH

      - name: Restart containers
        timeout-minutes: 5
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=6 root@${{ secrets.GAME_SERVER_HOST }} 'cd /opt/claudetorio/machines/game-server && docker compose run --rm factorio-config-init && docker compose run --rm factorio-scenarios-init && docker compose up -d --remove-orphans'

      - name: Health check
        run: |
          sleep 10
          ssh root@${{ secrets.GAME_SERVER_HOST }} 'set -a; source /opt/claudetorio/machines/game-server/.env; set +a; curl -sf -H "Host: ${APP_DOMAIN}" http://localhost/api/status | jq .run_count'

  deploy-stream-server:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull images and sync repo
        timeout-minutes: 5
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=6 root@${{ secrets.STREAM_SERVER_HOST }} bash -s << 'ENDSSH'
            set -euo pipefail
            set -a; source /opt/claudetorio/machines/stream-server/.env; set +a
            echo "$GHCR_PAT" | docker login ghcr.io -u bigsky77 --password-stdin
            for img in stream-agent stream-client stream-worker vtuber-stream-client; do
              echo "Pulling $img..."
              docker pull ghcr.io/bigsky77/claudetorio-${img}:latest
              docker tag ghcr.io/bigsky77/claudetorio-${img}:latest claudetorio-${img}:latest
            done
            git -C /opt/claudetorio fetch origin main
            git -C /opt/claudetorio reset --hard origin/main
          ENDSSH

      - name: Restart containers
        timeout-minutes: 5
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=6 root@${{ secrets.STREAM_SERVER_HOST }} 'cd /opt/claudetorio/machines/stream-server && docker compose run --rm factorio-client-init && docker compose up -d --remove-orphans'

      - name: Health check
        run: |
          sleep 10
          ssh root@${{ secrets.STREAM_SERVER_HOST }} 'curl -sf http://localhost:8090/health'
