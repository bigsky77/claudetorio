name: Deploy

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types: [completed]
    branches: [main]

jobs:
  changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      game_server: ${{ steps.filter.outputs.game_server }}
      stream_server: ${{ steps.filter.outputs.stream_server }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Detect changed paths
        id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"
          game_server=false
          stream_server=false
          if echo "$CHANGED" | grep -qE '^(packages/(broker|frontend|run-worker|stream-worker|fle|agent-runner)|machines/game-server|config)/'; then
            game_server=true
          fi
          if echo "$CHANGED" | grep -qE '^(packages/(stream-agent|stream-client|stream-worker|vtuber-stream-client)|machines/stream-server)/'; then
            stream_server=true
          fi
          echo "game_server=$game_server" >> $GITHUB_OUTPUT
          echo "stream_server=$stream_server" >> $GITHUB_OUTPUT

  deploy-game-server:
    needs: changes
    if: needs.changes.outputs.game_server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull images and sync repo
        timeout-minutes: 5
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=6 root@${{ secrets.GAME_SERVER_HOST }} bash -s << 'ENDSSH'
            set -euo pipefail
            set -a; source /opt/claudetorio/machines/game-server/.env; set +a
            echo "$GHCR_PAT" | docker login ghcr.io -u bigsky77 --password-stdin
            for img in broker frontend run-worker stream-worker; do
              echo "Pulling $img..."
              docker pull ghcr.io/bigsky77/claudetorio-${img}:latest
              docker tag ghcr.io/bigsky77/claudetorio-${img}:latest claudetorio-${img}:latest
            done
            git -C /opt/claudetorio fetch origin main
            git -C /opt/claudetorio reset --hard origin/main
          ENDSSH

      - name: Stop broker-spawned containers
        timeout-minutes: 2
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=6 root@${{ secrets.GAME_SERVER_HOST }} 'docker ps -q --filter name=factorio --filter name=run-worker --filter name=stream-worker | xargs -r docker rm -f || true'

      - name: Restart containers
        timeout-minutes: 5
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=6 root@${{ secrets.GAME_SERVER_HOST }} 'cd /opt/claudetorio/machines/game-server && docker compose run --rm factorio-config-init && docker compose run --rm factorio-scenarios-init && docker compose up -d --remove-orphans'

      - name: Health check
        run: |
          sleep 10
          curl -fsS https://api.claudetorio.ai/health | grep -q '"healthy"'

  deploy-stream-server:
    needs: changes
    if: needs.changes.outputs.stream_server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull images and sync repo
        timeout-minutes: 5
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=6 root@${{ secrets.STREAM_SERVER_HOST }} bash -s << 'ENDSSH'
            set -euo pipefail
            set -a; source /opt/claudetorio/machines/stream-server/.env; set +a
            echo "$GHCR_PAT" | docker login ghcr.io -u bigsky77 --password-stdin
            for img in stream-agent stream-client stream-worker vtuber-stream-client; do
              echo "Pulling $img..."
              docker pull ghcr.io/bigsky77/claudetorio-${img}:latest
              docker tag ghcr.io/bigsky77/claudetorio-${img}:latest claudetorio-${img}:latest
            done
            git -C /opt/claudetorio fetch origin main
            git -C /opt/claudetorio reset --hard origin/main
          ENDSSH

      - name: Restart containers
        timeout-minutes: 5
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=6 root@${{ secrets.STREAM_SERVER_HOST }} 'cd /opt/claudetorio/machines/stream-server && docker compose run --rm factorio-client-init && docker compose up -d --remove-orphans'

      - name: Health check
        run: |
          sleep 10
          ssh root@${{ secrets.STREAM_SERVER_HOST }} 'curl -sf http://localhost:8090/health'
