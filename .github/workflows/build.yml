name: Build and Push Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate-game-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate game-server compose
        run: docker compose --env-file machines/game-server/.env.example -f machines/game-server/docker-compose.yml config

  build:
    needs: validate-game-compose
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: broker
            context: ./packages/broker
            dockerfile: Dockerfile
            build_args: ""
          - name: frontend
            context: ./packages/frontend
            dockerfile: Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://app.claudetorio.ai
              NEXT_PUBLIC_STREAM_URL=https://stream.claudetorio.ai
              NEXT_PUBLIC_TWITCH_EMBED_PARENT=app.claudetorio.ai
              NEXT_PUBLIC_TWITCH_CHANNEL=claudetorio
          - name: run-worker
            context: ./packages
            dockerfile: run-worker/Dockerfile
            build_args: ""
          - name: stream-agent
            context: ./packages/stream-agent
            dockerfile: Dockerfile
            build_args: ""
          - name: stream-worker
            context: ./packages
            dockerfile: stream-worker/Dockerfile
            build_args: ""
          - name: stream-client
            context: ./packages/stream-client
            dockerfile: Dockerfile
            build_args: ""
          - name: vtuber-stream-client
            context: ./packages/vtuber-stream-client
            dockerfile: Dockerfile
            build_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bigsky77/claudetorio-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
